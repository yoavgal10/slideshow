<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slideshow Maker</title>
<style>
  :root {
    --bg: #f5f5f7; --panel: #fff; --text: #1d1d1f; --muted: #6e6e73;
    --border: #d9d9de; --accent: #2f6df6; --accent-text: #fff; --danger: #d33;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --panel: #202023; --text: #f2f2f4; --muted: #9a9aa2;
            --border: #34343a; --accent: #5b8dff; --accent-text: #0b0b0d; --danger: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 24px 0; }
  h1 { margin: 0; font-size: 22px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; padding: 20px 24px 40px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  #drop { border: 2px dashed var(--border); border-radius: 12px; padding: 28px; text-align: center; color: var(--muted); cursor: pointer; margin-bottom: 16px; }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--bg); position: relative; }
  .card.dragging { opacity: .35; }
  .card.target { outline: 2px solid var(--accent); }
  .card .thumb { aspect-ratio: 4/3; width: 100%; object-fit: cover; display: block; cursor: grab; }
  .card .num { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 12px; border-radius: 6px; padding: 1px 7px; }
  .card .tools { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
  .card .tools button { background: rgba(0,0,0,.65); color: #fff; border: 0; border-radius: 6px; width: 24px; height: 24px; cursor: pointer; font-size: 13px; padding: 0; }
  .card .tools button:hover { background: rgba(0,0,0,.85); }
  .card input { width: 100%; border: 0; border-top: 1px solid var(--border); padding: 8px 10px; background: transparent; color: var(--text); font: inherit; }
  .card input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .empty { color: var(--muted); text-align: center; padding: 10px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  select, input[type=number] { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; }
  input[type=range] { width: 100%; }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--text); font-size: 14px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 8px; background: #000; margin-bottom: 12px; }
  button.btn { border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 9px 14px; border-radius: 8px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .actions .btn { flex: 1; }
  progress { width: 100%; margin-top: 12px; }
  #status { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
  #result video { width: 100%; border-radius: 8px; margin-top: 12px; }
  #result a { display: inline-block; margin-top: 8px; }
</style>
</head>
<body>
<header><h1>Slideshow Maker</h1></header>
<main>
  <section class="panel">
    <div id="drop">Drop photos here or click to choose<br><small>Drag thumbnails to reorder. Everything stays on your device.</small></div>
    <input id="file" type="file" accept="image/*,.heic,.heif" multiple hidden>
    <div id="grid"></div>
    <div id="empty" class="empty">No photos yet</div>
  </section>

  <aside class="panel">
    <canvas id="canvas"></canvas>
    <div class="row">
      <button class="btn" id="play">▶ Preview</button>
      <button class="btn" id="clear">Clear all</button>
    </div>

    <label>Aspect ratio / resolution</label>
    <select id="size">
      <option value="1280x720">16:9 · 1280×720</option>
      <option value="1920x1080">16:9 · 1920×1080</option>
      <option value="1080x1920">9:16 · 1080×1920</option>
      <option value="1080x1080">1:1 · 1080×1080</option>
    </select>

    <div class="row">
      <div><label>Seconds per photo</label><input id="dur" type="number" min="1" max="30" step="0.5" value="4"></div>
      <div><label>Transition (s)</label><input id="trans" type="number" min="0" max="3" step="0.25" value="1"></div>
    </div>

    <label>Photo fit</label>
    <select id="fit">
      <option value="cover">Fill (crop edges)</option>
      <option value="contain">Fit (blurred background)</option>
    </select>

    <div class="check"><input type="checkbox" id="kb" checked><span>Slow zoom (Ken Burns)</span></div>

    <div class="actions"><button class="btn primary" id="make">Generate video</button></div>
    <progress id="prog" max="1" value="0" hidden></progress>
    <div id="status"></div>
    <div id="result"></div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
let slides = [];               // {id, url, img, title}
let nextId = 1, busy = false, previewing = false;

// ---------- Loading photos ----------
const IMG_EXT = /\.(jpe?g|png|gif|webp|bmp|avif|heic|heif)$/i;
const isHeic = f => /\.(heic|heif)$/i.test(f.name) || /image\/hei[cf]/.test(f.type);

function loadImage(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => res({ url, img });
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode failed')); };
    img.src = url;
  });
}

let heicLib;
function loadHeicLib() {
  return heicLib ||= new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
    s.onload = () => res(window.heic2any);
    s.onerror = () => { heicLib = null; rej(new Error('could not load HEIC converter')); };
    document.head.appendChild(s);
  });
}

async function decode(f) {
  try { return await loadImage(f); }       // native (Safari handles HEIC itself)
  catch (e) {
    if (!isHeic(f)) throw e;
    const heic2any = await loadHeicLib();   // Chrome/Firefox: convert HEIC → JPEG
    const out = await heic2any({ blob: f, toType: 'image/jpeg', quality: 0.92 });
    return loadImage(Array.isArray(out) ? out[0] : out);
  }
}

async function addFiles(files) {
  const all = [...files];
  const imgs = all.filter(f => f.type.startsWith('image/') || IMG_EXT.test(f.name));
  imgs.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  const failed = all.filter(f => !imgs.includes(f)).map(f => f.name);
  if (!imgs.length) { $('status').textContent = failed.length ? `Not an image: ${failed.join(', ')}` : ''; return; }
  $('status').textContent = `Loading ${imgs.length} photo${imgs.length > 1 ? 's' : ''}…`;
  const results = await Promise.all(imgs.map(f => decode(f).then(r => ({ f, ...r }), () => { failed.push(f.name); return null; })));
  results.forEach(r => r && slides.push({ id: nextId++, url: r.url, img: r.img, title: '' }));
  const ok = results.filter(Boolean).length;
  $('status').textContent = (ok ? `Added ${ok} photo${ok > 1 ? 's' : ''}.` : '') +
    (failed.length ? ` Couldn't load: ${failed.join(', ')}` : '');
  renderGrid(); drawFrame(0);
}

const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
['dragenter', 'dragover'].forEach(t => window.addEventListener(t, e => {
  if (!hasFiles(e)) return; e.preventDefault(); drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(t => window.addEventListener(t, e => {
  if (t === 'dragleave' && e.relatedTarget) return;
  drop.classList.remove('over');
}));
window.addEventListener('drop', e => { if (hasFiles(e)) { e.preventDefault(); addFiles(e.dataTransfer.files); } });

// ---------- Grid & reordering ----------
let dragId = null;
function move(from, to) {
  if (to < 0 || to >= slides.length || from === to) return;
  slides.splice(to, 0, slides.splice(from, 1)[0]);
  renderGrid();
}
function renderGrid() {
  const grid = $('grid'); grid.innerHTML = '';
  $('empty').hidden = slides.length > 0;
  slides.forEach((s, i) => {
    const c = document.createElement('div');
    c.className = 'card'; c.dataset.id = s.id;
    c.innerHTML = `<img class="thumb" src="${s.url}" draggable="true" alt="">
      <span class="num">${i + 1}</span>
      <div class="tools"><button title="Move earlier">◀</button><button title="Move later">▶</button><button title="Remove">✕</button></div>
      <input placeholder="Add a title…" maxlength="120">`;
    const [left, right, del] = c.querySelectorAll('button');
    left.onclick = () => move(i, i - 1);
    right.onclick = () => move(i, i + 1);
    del.onclick = () => { URL.revokeObjectURL(s.url); slides.splice(i, 1); renderGrid(); drawFrame(0); };
    const input = c.querySelector('input');
    input.value = s.title;
    input.oninput = () => { s.title = input.value; if (!previewing && !busy) drawFrame(i * dur()); };
    input.onfocus = () => { if (!previewing && !busy) drawFrame(i * dur()); };
    const thumb = c.querySelector('.thumb');
    thumb.ondragstart = e => { dragId = s.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(s.id)); };
    thumb.ondragend = () => { dragId = null; document.querySelectorAll('.card').forEach(x => x.classList.remove('dragging', 'target')); };
    c.ondragover = e => { if (dragId == null) return; e.preventDefault(); c.classList.add('target'); };
    c.ondragleave = () => c.classList.remove('target');
    c.ondrop = e => {
      if (dragId == null) return;
      e.preventDefault(); e.stopPropagation();
      const from = slides.findIndex(x => x.id === dragId);
      move(from, i);
    };
    grid.appendChild(c);
  });
}
$('clear').onclick = () => { if (busy) return; slides.forEach(s => URL.revokeObjectURL(s.url)); slides = []; renderGrid(); drawFrame(0); };

// ---------- Rendering ----------
const dur = () => Math.max(1, +$('dur').value || 4);
const trans = () => Math.min(dur() - 0.1, Math.max(0, +$('trans').value || 0));
const total = () => slides.length * dur();

function setSize() {
  const [w, h] = $('size').value.split('x').map(Number);
  canvas.width = w; canvas.height = h;
  drawFrame(0);
}
$('size').onchange = setSize;
['dur', 'trans', 'fit', 'kb'].forEach(id => $(id).onchange = () => drawFrame(0));

function drawImage(img, zoom) {
  const W = canvas.width, H = canvas.height;
  const contain = $('fit').value === 'contain';
  if (contain) { // blurred, filled background
    const s = Math.max(W / img.width, H / img.height);
    ctx.save(); ctx.filter = 'blur(30px) brightness(.55)';
    ctx.drawImage(img, (W - img.width * s) / 2, (H - img.height * s) / 2, img.width * s, img.height * s);
    ctx.restore();
  }
  const s = (contain ? Math.min(W / img.width, H / img.height) : Math.max(W / img.width, H / img.height)) * zoom;
  const w = img.width * s, h = img.height * s;
  ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
}

function drawTitle(text) {
  if (!text.trim()) return;
  const W = canvas.width, H = canvas.height;
  const size = Math.round(Math.min(W, H) * 0.06);
  ctx.font = `600 ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  const maxW = W * 0.86, lines = []; let line = '';
  for (const word of text.trim().split(/\s+/)) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = word; } else line = test;
  }
  lines.push(line);
  const lh = size * 1.25, blockH = lines.length * lh, bottom = H - size * 1.1;
  const g = ctx.createLinearGradient(0, bottom - blockH - size * 2, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.7)');
  ctx.fillStyle = g; ctx.fillRect(0, bottom - blockH - size * 2, W, H - (bottom - blockH - size * 2));
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = size * 0.25;
  lines.forEach((l, k) => ctx.fillText(l, W / 2, bottom - blockH + (k + 1) * lh - size * 0.25));
  ctx.shadowBlur = 0;
}

function drawSlide(s, alpha, progress) {
  ctx.globalAlpha = alpha;
  drawImage(s.img, $('kb').checked ? 1 + 0.06 * progress : 1);
  drawTitle(s.title);
  ctx.globalAlpha = 1;
}

function drawFrame(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!slides.length) {
    ctx.fillStyle = '#888'; ctx.font = `${canvas.height * 0.04}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.fillText('Add photos to begin', canvas.width / 2, canvas.height / 2);
    return;
  }
  const D = dur(), T = trans();
  const i = Math.min(slides.length - 1, Math.floor(t / D));
  const local = t - i * D;
  drawSlide(slides[i], 1, local / D);
  if (i < slides.length - 1 && T > 0 && local > D - T) {
    const a = (local - (D - T)) / T;
    drawSlide(slides[i + 1], a, 0);
  }
}

// ---------- Preview ----------
function play(onDone, onTick) {
  const start = performance.now(), end = total();
  return new Promise(resolve => {
    (function loop() {
      const t = (performance.now() - start) / 1000;
      if (t >= end || (!previewing && !busy)) { drawFrame(Math.min(t, end - 0.001)); resolve(); return; }
      drawFrame(t); onTick && onTick(t / end);
      requestAnimationFrame(loop);
    })();
  });
}
$('play').onclick = async () => {
  if (busy || !slides.length) return;
  if (previewing) { previewing = false; return; }
  previewing = true; $('play').textContent = '■ Stop';
  await play();
  previewing = false; $('play').textContent = '▶ Preview'; drawFrame(0);
};

// ---------- Video generation ----------
function pickMime() {
  const opts = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  return opts.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
}
$('make').onclick = async () => {
  if (busy || !slides.length) return;
  const mime = pickMime();
  if (!mime) { $('status').textContent = 'This browser does not support video recording. Try Chrome, Edge or Safari.'; return; }
  previewing = false; busy = true;
  ['make', 'play', 'clear'].forEach(id => $(id).disabled = true);
  $('result').innerHTML = ''; $('prog').hidden = false; $('prog').value = 0;
  $('status').textContent = 'Recording… keep this tab visible until it finishes.';

  const stream = canvas.captureStream(30);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: canvas.width >= 1920 ? 12e6 : 6e6 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const stopped = new Promise(r => rec.onstop = r);
  rec.start(500);
  await play(null, p => $('prog').value = p);
  drawFrame(total() - 0.001);
  await new Promise(r => setTimeout(r, 400)); // flush last frame
  rec.stop(); await stopped;

  const blob = new Blob(chunks, { type: mime.split(';')[0] });
  const url = URL.createObjectURL(blob);
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
  $('result').innerHTML = `<video src="${url}" controls></video><a href="${url}" download="slideshow.${ext}" class="btn primary" style="text-decoration:none">Download slideshow.${ext} (${(blob.size / 1e6).toFixed(1)} MB)</a>`;
  $('status').textContent = 'Done.';
  $('prog').hidden = true; busy = false;
  ['make', 'play', 'clear'].forEach(id => $(id).disabled = false);
  drawFrame(0);
};

setSize(); renderGrid();
</script>
</body>
</html>
